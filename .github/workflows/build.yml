name: Build FreeTube IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-15
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "=== Available Xcode versions ==="
          find /Applications -maxdepth 1 -name 'Xcode*' -type d 2>/dev/null | sort
          echo ""
          XC26=$(find /Applications -maxdepth 1 -name 'Xcode_26*' -type d 2>/dev/null | head -1)
          if [ -n "$XC26" ]; then
            echo "Found Xcode 26: $XC26"
            sudo xcode-select -s "$XC26"
          else
            LATEST=$(find /Applications -maxdepth 1 -name 'Xcode*' -type d 2>/dev/null | sort -V | tail -1)
            echo "Using: $LATEST"
            sudo xcode-select -s "$LATEST"
          fi
          xcodebuild -version

      - name: Patch LNPopupUI version for Xcode 16 compatibility
        run: |
          XCVER=$(xcodebuild -version | head -1 | grep -oE '[0-9]+' | head -1)
          echo "Xcode major version: $XCVER"
          if [ "$XCVER" -lt 26 ]; then
            echo "Xcode < 26: pinning LNPopupUI from 3.0.2 to 3.0.0"
            sed -i '' 's/minimumVersion = 3.0.2;/minimumVersion = 3.0.0;/g' FreeTube/FreeTube.xcodeproj/project.pbxproj
            sed -i '' 's/minimumVersion = 3.0.1;/minimumVersion = 3.0.0;/g' FreeTube/FreeTube.xcodeproj/project.pbxproj
          else
            echo "Xcode 26+: no version patch needed"
          fi

      - name: Setup code signing
        run: |
          # Decode p12 and mobileprovision from GitHub Secrets
          echo "$BUILD_P12" | base64 -d > certificate.p12
          echo "$BUILD_PROVISION" | base64 -d > profile.mobileprovision

          # Install provision profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

          # Import certificate to keychain
          security create-keychain -p temp build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p temp build.keychain
          security import certificate.p12 -k build.keychain -P "$BUILD_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/xcodebuild 2>&1 | tail -3 || true
          security set-key-partition-list -S apple-tool:,apple: -s -k temp build.keychain 2>&1 | tail -2 || true

          # Extract team ID, bundle ID, and provisioning profile UUID from the mobileprovision
          PLAIN=$(security cms -D -i profile.mobileprovision)
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" /dev/stdin <<< "$PLAIN")
          PROV_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< "$PLAIN")
          # application-identifier = TEAM.bundle; strip team prefix
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" /dev/stdin <<< "$PLAIN" | sed "s/^$TEAM_ID\.//")
          echo "TEAM_ID=$TEAM_ID" >> $GITHUB_ENV
          echo "PROV_UUID=$PROV_UUID" >> $GITHUB_ENV
          echo "BUNDLE_ID=$BUNDLE_ID" >> $GITHUB_ENV
          echo "Bundle ID: $BUNDLE_ID | Team: $TEAM_ID | UUID: $PROV_UUID"

          # Override FreeTube bundle ID with the one in the provision profile
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = com\.leshko\.freetube;/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;/g" FreeTube/FreeTube.xcodeproj/project.pbxproj
          echo "Patched bundle ID to: $BUNDLE_ID"
          grep 'PRODUCT_BUNDLE_IDENTIFIER' FreeTube/FreeTube.xcodeproj/project.pbxproj
        env:
          BUILD_P12: ${{ secrets.BUILD_P12 }}
          BUILD_PROVISION: ${{ secrets.BUILD_PROVISION }}
          BUILD_P12_PASSWORD: ${{ secrets.BUILD_P12_PASSWORD }}

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project FreeTube/FreeTube.xcodeproj \
            -scheme FreeTube \
            -clonedSourcePackagesDirPath SPM

      - name: Build and Archive
        run: |
          xcodebuild archive \
            -project FreeTube/FreeTube.xcodeproj \
            -scheme FreeTube \
            -configuration Release \
            -archivePath FreeTube.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROV_UUID" \
            -clonedSourcePackagesDirPath SPM \
            -skipMacroValidation \
            -skipPackagePluginValidation

      - name: Export signed IPA (ad-hoc)
        run: |
          # Ad Hoc method since this is a single-device profile (not enterprise In-House)
          cat > exportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>ad-hoc</string>
              <key>teamID</key>
              <string>$TEAM_ID</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>$BUNDLE_ID</key>
                  <string>$PROV_UUID</string>
              </dict>
              <key>signingCertificate</key>
              <string>iPhone Distribution</string>
              <key>stripSwiftSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath FreeTube.xcarchive \
            -exportPath output \
            -exportOptionsPlist exportOptions.plist

          ls -la output/
          mv output/*.ipa FreeTube-signed.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FreeTube.ipa
          path: FreeTube-signed.ipa
          retention-days: 7
