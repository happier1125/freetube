name: Build FreeTube IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-15
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "=== Available Xcode versions ==="
          find /Applications -maxdepth 1 -name 'Xcode*' -type d 2>/dev/null | sort
          XC26=$(find /Applications -maxdepth 1 -name 'Xcode_26*' -type d 2>/dev/null | head -1)
          if [ -n "$XC26" ]; then
            echo "Found Xcode 26: $XC26"
            sudo xcode-select -s "$XC26"
          else
            LATEST=$(find /Applications -maxdepth 1 -name 'Xcode*' -type d 2>/dev/null | sort -V | tail -1)
            echo "Using: $LATEST"
            sudo xcode-select -s "$LATEST"
          fi
          xcodebuild -version

      - name: Patch LNPopupUI version for Xcode 16 compatibility
        run: |
          XCVER=$(xcodebuild -version | head -1 | grep -oE '[0-9]+' | head -1)
          if [ "$XCVER" -lt 26 ]; then
            echo "Pinning LNPopupUI 3.0.2 -> 3.0.0 for Xcode $XCVER"
            sed -i '' 's/minimumVersion = 3.0.2;/minimumVersion = 3.0.0;/g' FreeTube/FreeTube.xcodeproj/project.pbxproj
            sed -i '' 's/minimumVersion = 3.0.1;/minimumVersion = 3.0.0;/g' FreeTube/FreeTube.xcodeproj/project.pbxproj
          fi

      - name: Setup signing materials
        run: |
          echo "$BUILD_P12" | base64 -d > certificate.p12
          echo "$BUILD_PROVISION" | base64 -d > profile.mobileprovision

          # --- Convert legacy/openssl-made p12 to a modern format ---
          # The p12 may be encrypted with legacy algorithms (RC2/3DES) which
          # macOS `security import` rejects. Re-export with a known modern password.
          export P12PASS="$BUILD_P12_PASSWORD"
          # Try legacy algorithms first (older p12); fall back to default if needed.
          if ! openssl pkcs12 -legacy -in certificate.p12 -passin "env:P12PASS" -out certkey.pem -nodes 2>/dev/null; then
            openssl pkcs12 -in certificate.p12 -passin "env:P12PASS" -out certkey.pem -nodes
          fi
          echo "=== openssl unpack done ==="
          # Re-export with a fixed modern password 'newpass' using default (aes256) algorithm
          openssl pkcs12 -export -in certkey.pem -out converted.p12 -passout pass:newpass -name "FreeTube"
          echo "=== converted.p12 created ==="

          # Create & unlock a dedicated keychain
          security create-keychain -p temp build.keychain
          security list-keychains -d user -s "$HOME/Library/Keychains/build.keychain-db"
          security default-keychain -s build.keychain
          security unlock-keychain -p temp build.keychain

          # Import the CONVERTED certificate - FAIL LOUDLY if it fails
          security import converted.p12 -k build.keychain -P newpass -T /usr/bin/codesign -T /usr/bin/codesign_allocate
          echo "=== Import exit: $? ==="

          # Unlock again (some runners re-lock) + allow codesign access
          security unlock-keychain -p temp build.keychain 2>/dev/null || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k temp build.keychain 2>&1 | tail -1 || true

          echo "=== Keychain identities AFTER import ==="
          security find-identity -v -p codesigning build.keychain

          # Parse provision profile
          PLAIN=$(security cms -D -i profile.mobileprovision)
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" /dev/stdin <<< "$PLAIN")
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" /dev/stdin <<< "$PLAIN" | sed "s/^$TEAM_ID\.//")
          echo "TEAM_ID=$TEAM_ID" >> $GITHUB_ENV
          echo "BUNDLE_ID=$BUNDLE_ID" >> $GITHUB_ENV

          # Capture the signing identity (full common name) from the keychain
          IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep -oE '"[^"]+"' | tr -d '"' | head -1)
          echo "IDENTITY=$IDENTITY" >> $GITHUB_ENV
          echo "TEAM_ID=$TEAM_ID  BUNDLE_ID=$BUNDLE_ID"
          echo "== Signing identity: '$IDENTITY' =="
        env:
          BUILD_P12: ${{ secrets.BUILD_P12 }}
          BUILD_PROVISION: ${{ secrets.BUILD_PROVISION }}
          BUILD_P12_PASSWORD: ${{ secrets.BUILD_P12_PASSWORD }}

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project FreeTube/FreeTube.xcodeproj \
            -scheme FreeTube \
            -clonedSourcePackagesDirPath SPM

      - name: Build and Archive (unsigned)
        run: |
          xcodebuild archive \
            -project FreeTube/FreeTube.xcodeproj \
            -scheme FreeTube \
            -configuration Release \
            -archivePath FreeTube.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            -clonedSourcePackagesDirPath SPM \
            -skipMacroValidation \
            -skipPackagePluginValidation

      - name: Sign app with certificate + provisioning
        run: |
          APP=FreeTube.xcarchive/Products/Applications/FreeTube.app

          # Re-point keychain so codesign sees the identity
          security unlock-keychain -p temp "$HOME/Library/Keychains/build.keychain-db" 2>/dev/null || \
            security unlock-keychain -p temp build.keychain
          security list-keychains -d user -s "$HOME/Library/Keychains/build.keychain-db"
          security default-keychain -s build.keychain

          # Override bundle ID in Info.plist to match provision
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" $APP/Info.plist

          # Extract entitlements from provision profile
          # security cms -D outputs a (binary) plist; convert to XML first,
          # then have PlistBuddy emit an XML plist (codesign needs a valid
          # plist, not the old-style {a=b;} ASCII output).
          security cms -D -i profile.mobileprovision > profile.plist
          plutil -convert xml1 profile.plist -o profile.xml
          /usr/libexec/PlistBuddy -x -c "Print :Entitlements" profile.xml > entitlements.plist
          echo "=== entitlements.plist ==="
          cat entitlements.plist

          echo "=== Signing with identity: '$IDENTITY' ==="
          # Correct recursive bottom-up re-sign of ALL nested code.
          # SPM binary frameworks (Python.framework, FFmpeg.framework, ...) carry their own
          # identifiers/entitlements from their build. If we re-sign them without
          # --preserve-metadata, their sealed identifiers/entitlements change and the process
          # is killed at load time (crash when tapping a video -> Python/yt-dlp loads).
          # Sign deepest-first so a framework nested inside another is sealed before its parent.
          DEEP_SIGN() {
            find "$1" -name "*.framework" -type d | awk '{ print length, $0 }' | sort -rn | cut -d' ' -f2- | while read FW; do
              echo "  sign framework: ${FW#$APP/}"
              /usr/bin/codesign --force --sign "$IDENTITY" --preserve-metadata=identifier,entitlements,flags,runtime "$FW"
            done
            # any app extensions (PlugIns/*.appex) — these also need re-sealing
            find "$1" -name "*.appex" -type d | awk '{ print length, $0 }' | sort -rn | cut -d' ' -f2- | while read AX; do
              echo "  sign appex: ${AX#$APP/}"
              /usr/bin/codesign --force --sign "$IDENTITY" --preserve-metadata=identifier,entitlements,flags,runtime "$AX"
            done
          }

          # 1. Frameworks + extensions embedded in the app
          DEEP_SIGN "$APP"

          # 2. Main app bundle (with exact entitlements from provision profile)
          /usr/bin/codesign --force --sign "$IDENTITY" --timestamp=none \
            --entitlements entitlements.plist "$APP"

          echo "=== Verifying (deep, strict) ==="
          /usr/bin/codesign --verify --deep --strict $APP
          echo "Codesign deep verification OK"
          echo "=== Entitlements actually applied ==="
          /usr/bin/codesign -d --entitlements - $APP 2>/dev/null | grep -E 'application-identifier|get-task-allow|keychain-access|push' || echo "(no matching entitlement keys)"

      - name: Build IPA
        run: |
          mkdir -p Payload
          cp -R FreeTube.xcarchive/Products/Applications/FreeTube.app Payload/
          zip -r FreeTube-signed.ipa Payload
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FreeTube.ipa
          path: FreeTube-signed.ipa
          retention-days: 7
